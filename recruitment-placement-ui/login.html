<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | Recruitment & Placement</title><link rel="stylesheet" href="css/style.css"></head><body><div class="login-page"><div class="login-box"><div class="brand"><img src="images/logo.svg"><span>Kiran Academy</span></div><h1>Welcome back</h1><p>Sign in to Recruitment &amp; Placement Management System</p><div class="field"><label>Username / Email</label><input type="email" placeholder="recruiter@demo.com" value="recruiter@demo.com"></div><div class="field"><label>Password</label><input type="password" placeholder="Enter password" value="password"></div><div class="field"><label>Role</label><select><option>Recruiter</option><option>Admin</option><option>Placement Officer</option></select></div><a class="btn primary" href="dashboard.html">Login</a><button class="btn secondary" onclick="document.querySelectorAll('input').forEach(x=>x.value='')">Reset</button><div class="hint">Forgot password? (prototype only) · Authorized users only</div></div></div></body></html>
